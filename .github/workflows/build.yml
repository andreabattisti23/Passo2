      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Firma sempre uguale (gli aggiornamenti si installano sopra)
        run: |
          mkdir -p ~/.android
          cp passo/android-debug.keystore ~/.android/debug.keystore

      - name: Compila l'app
        working-directory: passo
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          npm ci
          npm i --no-save sharp
          npm run build
          npx cap add android
          node scripts/setup-android.mjs
          npx cap sync android

      - name: Compila l'APK
        working-directory: passo/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Passo.apk

      - name: Pubblica l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Passo 1.1 (build ${{ github.run_number }})
          body: Scarica Passo.apk e aprilo sul telefono per installare.
          files: Passo.apk
